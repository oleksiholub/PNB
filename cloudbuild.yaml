# --- Cloud Build pipeline: build image, push, deploy to Cloud Run (us-east1) ---
# Region is fixed to us-east1 per TZ budget constraint (Always Free eligibility).
substitutions:
  _SERVICE_NAME: pnb-backend
  _REGION: us-east1
  _REPO: pnb-backend-repo

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: "Build container image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}"
      - "."

  - id: "Push container image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}"

  - id: "Deploy to Cloud Run"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--service-account=${_SERVICE_NAME}@${PROJECT_ID}.iam.gserviceaccount.com"
      - "--min-instances=0"
      - "--max-instances=4"
      - "--memory=512Mi"
      - "--cpu=1"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}"

timeout: "1200s"
